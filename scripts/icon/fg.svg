<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="1024" height="1024">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3.2"/></filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1"/></filter>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5d6985"/><stop offset="1" stop-color="#262d3f"/></linearGradient>
    <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ff9a2a" stop-opacity="0"/><stop offset="1" stop-color="#ffcf4a" stop-opacity="0.95"/></linearGradient>
  </defs>
  <g transform="translate(54 52) scale(0.88) translate(-54 -50)">
  <!-- stone platform -->
  <ellipse cx="54" cy="76" rx="25" ry="8.5" fill="#0008" transform="translate(1 1.5)"/>
  <ellipse cx="54" cy="75" rx="25" ry="8.5" fill="url(#stone)" stroke="#8090b0" stroke-width="0.8"/>
  <ellipse cx="54" cy="74.5" rx="19" ry="6" fill="#323a4e"/>
  <ellipse cx="54" cy="74.5" rx="15" ry="4.6" fill="none" stroke="#6ed2ff" stroke-width="0.7" opacity="0.8"/>
  <ellipse cx="54" cy="74" rx="13" ry="4" fill="#7fe6ff" opacity="0.35" filter="url(#soft)"/>
  <!-- crystal glow -->
  <polygon points="54,22 63.5,40 62,61 54,70 46,61 44.5,40" fill="#7fe6ff" opacity="0.75" filter="url(#glow)"/>
  <!-- crystal facets -->
  <polygon points="54,22 63.5,40 62,61 54,70 46,61 44.5,40" fill="#3fa9c9"/>
  <polygon points="54,22 54,41 44.5,40" fill="#d8f8ff"/>
  <polygon points="54,22 63.5,40 54,41" fill="#8fe6fb"/>
  <polygon points="44.5,40 54,41 54,64 46,61" fill="#a6eefc"/>
  <polygon points="54,41 63.5,40 62,61 54,64" fill="#4fb8d6"/>
  <polygon points="46,61 54,64 54,70" fill="#6fd0e8"/>
  <polygon points="54,64 62,61 54,70" fill="#2b86a6"/>
  <path d="M54 22 L54 64 M49 30 L48.2 52" stroke="#fff" stroke-opacity="0.6" stroke-width="0.6" fill="none"/>
  <!-- cracks -->
  <path d="M61.5 50 L57.5 48 L55 43 L56 38 M57.5 48 L52.5 50 L50 56 L51 61 M55 43 L50.5 40.5 M52.5 50 L48 48" stroke="#1b0f2a" stroke-width="0.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- arrow stuck in the crystal (from the right) -->
  <g transform="translate(61 50) rotate(-18)">
    <line x1="0" y1="0" x2="18" y2="0" stroke="#7a5530" stroke-width="1.3" stroke-linecap="round"/>
    <polygon points="18,0 22,-3 17,0 22,3" fill="#d9534f"/>
  </g>
  <!-- impact spark on the stuck arrow -->
  <g transform="translate(61 50)">
    <polygon points="0,-5 1.2,-1.2 5,0 1.2,1.2 0,5 -1.2,1.2 -5,0 -1.2,-1.2" fill="#ffd25a"/>
    <circle r="1.6" fill="#fff"/>
  </g>
  <!-- arrow flying in from the left -->
  <g transform="translate(20 34) rotate(18)">
    <line x1="-8" y1="0" x2="12" y2="0" stroke="#7a5530" stroke-width="1.3" stroke-linecap="round"/>
    <polygon points="12,-2.2 17,0 12,2.2" fill="#e8e8e8"/>
    <polygon points="-8,0 -11,-2.6 -6,0 -11,2.6" fill="#d9534f"/>
  </g>
  <!-- arrow flying in from the lower left -->
  <g transform="translate(24 66) rotate(-24)">
    <line x1="-8" y1="0" x2="10" y2="0" stroke="#7a5530" stroke-width="1.3" stroke-linecap="round"/>
    <polygon points="10,-2.2 15,0 10,2.2" fill="#e8e8e8"/>
    <polygon points="-8,0 -11,-2.6 -6,0 -11,2.6" fill="#d9534f"/>
  </g>
  <!-- fireball from the upper right -->
  <g transform="translate(71 29) rotate(135)">
    <path d="M0 -4.5 L-22 -1 L-22 1 L0 4.5 Z" fill="url(#trail)"/>
    <circle r="5.5" fill="#ff7a1a" filter="url(#soft)"/>
    <circle r="4" fill="#ffb02e"/><circle r="2.2" fill="#fff2b0"/>
  </g>
  <!-- impact spark at upper-left edge -->
  <g transform="translate(46 37)">
    <polygon points="0,-4 1,-1 4,0 1,1 0,4 -1,1 -4,0 -1,-1" fill="#ffd25a"/>
  </g>
  <!-- shards flying off -->
  <polygon points="40,30 42,28.5 41.5,31" fill="#a6eefc"/>
  <polygon points="67,36 69.5,35 68.5,37.5" fill="#8fe6fb"/>
  <polygon points="38,46 39.8,45 39.5,47.2" fill="#d8f8ff"/>
  </g>
</svg>
