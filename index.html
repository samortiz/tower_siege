<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Tower Siege</title>
<style>
  html, body { margin: 0; height: 100%; background: #111418; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; }
  canvas#c { display: block; image-rendering: auto; box-shadow: 0 0 40px #000; cursor: crosshair; position: absolute; touch-action: none; }
  body.touch, body.touch * { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  .pad { position: absolute; display: none; overflow: hidden; }
  body.touch.inplay .pad { display: block; }
  #btnGrid { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: grid;
    grid-template-columns: repeat(var(--cols, 2), var(--bw, 60px)); gap: 8px; }
  .tb { width: var(--bw, 60px); height: var(--bh, 60px); border-radius: 12px; box-sizing: border-box; background: #232a35dd;
    border: 2px solid #3a424f; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center;
    font: bold 20px sans-serif; line-height: 1.1; }
  .tb small { font: 11px sans-serif; color: #b4bccb; margin-top: 2px; white-space: nowrap; }
  .tb.on { border-color: #ffd84a; background: #3b4f73; color: #ffd84a; }
  .tb.dim { opacity: 0.35; }
  .tb.gone { display: none; }
  .tb.press { background: #34405a; border-color: #c5ccd8; }
  #tip { position: absolute; display: none; pointer-events: none; transform: translateX(-50%); padding: 5px 12px; border-radius: 8px;
    background: #000c; color: #ffd84a; font: bold 13px sans-serif; white-space: nowrap; }
  #fsBtn { position: fixed; right: 8px; top: 8px; width: 40px; height: 40px; border-radius: 10px; display: none; align-items: center;
    justify-content: center; background: #232a35cc; border: 2px solid #3a424f; color: #fff; font: 20px sans-serif; z-index: 5; }
  body.touch.fsok #fsBtn { display: flex; }
  body.touch.inplay #fsBtn { display: none; }
  #rot { position: absolute; display: none; left: 0; right: 0; bottom: 8px; text-align: center; color: #8a93a3; font: 12px sans-serif; pointer-events: none; }
  #bbar { position: absolute; display: none; box-sizing: border-box; padding: 4px; gap: 4px; background: #1b1f26; border-top: 2px solid #333a45;
    grid-template-columns: repeat(var(--bcols, 12), minmax(0, 1fr)); grid-auto-rows: minmax(0, 1fr); }
  body.touch.inplay #bbar { display: grid; }
  #bbar.side { border-top: 0; border-right: 2px solid #333a45; padding: 8px; gap: 6px; background: #14171c; }
  #bbar.side.right { border-right: 0; border-left: 2px solid #333a45; }
  #bbar.side .bb { border-radius: 10px; font-size: 11px; gap: 0; }
  #bbar.side .bb canvas { width: 28px; height: 28px; }
  .bb > * { flex-shrink: 0; }
  #bbar.side .bb .c { font-size: 13px; }
  #bbar.side .bb.hero .n { font-size: 11px; }
  #bbar.side .bb .pips i { width: 7px; height: 6px; }
  .bb { border-radius: 8px; background: #262c36; border: 2px solid #3a424f; box-sizing: border-box; min-width: 0; overflow: hidden;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; color: #fff; font: bold 9px sans-serif; }
  .bb canvas { width: 26px; height: 26px; display: block; }
  .bb .n { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; box-sizing: border-box; }
  .bb .c { color: #ffd84a; font-size: 11px; white-space: nowrap; }
  .bb.sel { border-color: #ffd84a; background: #3d4b63; }
  .bb.poor .c { color: #c77; }
  .bb.poor canvas, .bb.poor .n { opacity: 0.55; }
  .bb.max .c { color: #9f9; }
  .bb.press { background: #34405a; }
  .bb.gone { display: none; }
  .bb .pips { display: flex; gap: 2px; }
  .bb .pips i { width: 6px; height: 5px; background: #3a424f; }
  .bb.hero .n { font-size: 10px; }
  /* Optional joystick, in a bottom corner of the map */
  #stickZone { position: absolute; display: none; z-index: 3; }
  body.touch.inplay.stick #stickZone { display: block; }
  #stickBase { position: absolute; left: 50%; top: 50%; width: 120px; height: 120px; margin: -60px 0 0 -60px; border-radius: 50%;
    border: 2px solid #ffffff40; background: #0000002a; pointer-events: none; }
  #stickBase.live { border-color: #ffd84a90; background: #ffd84a14; }
  #stickKnob { position: absolute; width: 52px; height: 52px; margin: -26px 0 0 -26px; border-radius: 50%; left: 50%; top: 50%;
    background: #ffffff40; box-shadow: 0 2px 8px #0008; }
  #stickBase.live #stickKnob { background: #ffd84acc; }
  /* Card for the building you tapped: stats now -> next level, and its actions */
  #card { position: absolute; display: none; z-index: 4; width: 212px; box-sizing: border-box; padding: 8px 10px 10px; border-radius: 12px;
    background: #12161ce8; border: 2px solid #3a424f; color: #fff; font: 12px sans-serif; box-shadow: 0 4px 16px #000a; }
  #card .h { display: flex; align-items: center; gap: 6px; font: bold 14px sans-serif; margin-bottom: 6px; }
  #card .h .lv { color: #ffd84a; font-size: 12px; }
  #card .h .x { margin-left: auto; width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    background: #262c36; color: #b4bccb; font-size: 14px; }
  #card .r { display: flex; justify-content: space-between; gap: 8px; line-height: 19px; color: #b4bccb; }
  #card .r b { color: #fff; font-weight: bold; white-space: nowrap; }
  #card .r i { color: #9f9; font-style: normal; }
  #card .note { color: #c9a; margin-top: 4px; }
  #card .acts { display: flex; gap: 6px; margin-top: 8px; }
  #card .act { flex: 1; min-height: 46px; border-radius: 10px; background: #262c36; border: 2px solid #3a424f; display: flex; flex-direction: column;
    align-items: center; justify-content: center; font: bold 13px sans-serif; }
  #card .act span { color: #ffd84a; font-size: 12px; }
  #card .act.poor span { color: #c77; }
  #card .act.off { opacity: 0.4; }
  #card .act.press { background: #34405a; border-color: #c5ccd8; }
  #kb { position: fixed; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; border: 0; padding: 0; font-size: 16px; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="rot">Turn your phone sideways for a bigger view</div>
<div class="pad" id="padR"><div id="btnGrid"></div></div>
<div id="tip"></div>
<div id="stickZone"><div id="stickBase"><div id="stickKnob"></div></div></div>
<div id="card"></div>
<div id="bbar"></div>
<div id="fsBtn">⛶</div>
<input id="kb" type="text" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="go">
<script src="sim.js"></script>
<script>
"use strict";
// ---------- Constants ----------
// The simulation (data tables, game state, rules) lives in sim.js, loaded just before this script.
const BAR = 72;
const BW = 31 * T, BH = 23 * T;                             // base viewport: menus and the bottom bar are laid out for this
let W = BW, H = BH;                                         // visible map viewport (logical pixels) — grows to fill the window, see fit()
// Camera: follows the hero; arrow keys / middle-drag / minimap scroll it freely, C recenters
const cam = { x: 0, y: 0, follow: true };
// Map zoom (pinch, mouse wheel, + / -): the world is drawn ZOOM× bigger, so the camera sees VW × VH world pixels
let ZOOM = 1;
const ZOOM_MIN = 0.5, ZOOM_MAX = 3;
const VW = () => W / ZOOM, VH = () => H / ZOOM;
let MM_S = 3, MM_W = COLS * MM_S, MM_H = ROWS * MM_S, MM_X = W - MM_W - 8;
let MM_Y = 38;   // just under the top bar (see fit)
// The minimap scales with the map size
onMapSize = () => { MM_S = Math.max(2, Math.floor(183 / COLS)); MM_W = COLS * MM_S; MM_H = ROWS * MM_S; MM_X = W - MM_W - 8; };
// UI state: the building picked for placing, the barracks whose squad is being moved, the marker where soldiers were sent
let selected = null, rallyMode = null, orderFx = null;

// ---------- Settings (saved in this browser) ----------
const SPEEDS = [1, 1.5, 2, 4];
const PAUSE_BTN = { x: 440, y: 4, w: 26, h: 22 }, SPEED_BTN = { x: 470, y: 4, w: 102, h: 22 };   // top-bar controls
// speedPaused (in sim.js): frozen from the top bar / [ key: no menu, camera and building still work
// Pause sits just below 1× when stepping with [ and ]
function stepSpeed(d, wrap) {
  const i = SPEEDS.indexOf(settings.speed), n = SPEEDS.length;
  if (speedPaused) { if (d > 0) speedPaused = false; return; }
  if (d < 0 && i === 0 && !wrap) { speedPaused = true; return; }
  settings.speed = SPEEDS[wrap ? (i + d + n) % n : Math.max(0, Math.min(n - 1, i + d))]; saveSettings();
}
const overBtn = b => mouse.sx >= b.x && mouse.sx <= b.x + b.w && mouse.sy >= b.y && mouse.sy <= b.y + b.h;
function overSpeedBtn() { return overHud(SPEED_BTN) || overHud(PAUSE_BTN); }
// The top bar is drawn bigger on touch screens; its buttons are laid out in unscaled "HUD" coordinates
function hudK() { return touchUI ? 1.35 : 1; }
// Online co-op always runs at 1× with no top-bar pause/speed (the host's menu still pauses everyone)
const speedUi = () => !net.role;
const overHud = b => { if (!speedUi()) return false; const k = hudK(); return mouse.sx >= b.x * k && mouse.sx <= (b.x + b.w) * k && mouse.sy >= b.y * k && mouse.sy <= (b.y + b.h) * k; };
const settings = { difficulty: 'normal', mapSize: 'large', speed: 1, minimap: true, hero: 'ranger', name: '', buildSide: 'left', stick: 'off', servers: [], seats: {} };
try {
  const saved = JSON.parse(localStorage.getItem('towerSiegeSettings') || '{}');
  if (DIFFS[saved.difficulty]) settings.difficulty = saved.difficulty;
  if (MAP_SIZES[saved.mapSize]) settings.mapSize = saved.mapSize;
  if (SPEEDS.includes(saved.speed)) settings.speed = saved.speed;
  if (typeof saved.minimap === 'boolean') settings.minimap = saved.minimap;
  if (['ranger', 'knight', 'mage', 'engineer'].includes(saved.hero)) settings.hero = saved.hero;
  if (typeof saved.name === 'string') settings.name = cleanName(saved.name);
  if (['left', 'right'].includes(saved.buildSide)) settings.buildSide = saved.buildSide;
  if (['off', 'left', 'right'].includes(saved.stick)) settings.stick = saved.stick;
  // Reconnect tokens for the online rooms joined lately ('<server address>#<room>' → token): rejoining a room with its token gives back your hero
  if (saved.seats && typeof saved.seats === 'object') for (const [k, v] of Object.entries(saved.seats).slice(-8)) if (typeof v === 'string') settings.seats[k.slice(0, 140)] = v.slice(0, 40);
  // Co-op servers joined before, most recent first: [{ addr, name }]
  if (Array.isArray(saved.servers)) settings.servers = saved.servers.filter(v => v && typeof v.addr === 'string').slice(0, 5)
    .map(v => ({ addr: v.addr.slice(0, 120), name: typeof v.name === 'string' ? v.name.slice(0, 30) : '' }));
} catch (e) { /* storage unavailable: use defaults */ }
function saveSettings() { try { localStorage.setItem('towerSiegeSettings', JSON.stringify(settings)); } catch (e) {} }
const myName = () => cleanName(settings.name) || 'Player';

const canvas = document.getElementById('c');
let ctx = canvas.getContext('2d');   // swapped briefly to draw the touch bar's icons
// Render at the screen's real pixel density (capped at 2x) for crisp graphics; game logic stays in logical pixels
const DPR = Math.min(2, Math.max(1, typeof devicePixelRatio !== 'undefined' ? devicePixelRatio : 1));
let CW = W, CH = H + BAR;
// Touch devices get on-screen controls beside the canvas (landscape) or below it (portrait)
let touchUI = (typeof matchMedia !== 'undefined' && matchMedia('(pointer: coarse)').matches) && navigator.maxTouchPoints > 0;
const PAD_BELOW = 220, TBAR_H = 64;
// Landscape touch play: build/hero buttons fill a column on the left, actions a column on the right.
// Each column is two buttons wide, sized so the 12 build + hero buttons fit in six rows.
const sideW = ih => Math.round(Math.max(120, Math.min(176, 2 * Math.min(76, (ih - 16 - 5 * 6) / 6) + 6 + 16)));
let viewScale = 1, touchReady = false;   // touchReady: the touch-control code below has run
function fit() {
  const iw = innerWidth, ih = innerHeight, land = iw >= ih;
  // The canvas fills the window (minus the touch pads). The scale is set so the base layout (BW × BH + BAR)
  // just fits; the leftover width or height becomes extra visible map.
  // While playing on a touch screen the pads and a big-button build bar (DOM) take part of the window,
  // and the canvas leaves out its own bottom bar.
  const tp = touchUI && touchReady && gameState === 'play';
  const tb = !tp || land ? 0 : 2 * TBAR_H - 6;
  const cw = tp && land ? Math.max(1, iw - 2 * sideW(ih)) : iw;
  const ch = Math.max(1, (tp && !land ? ih - PAD_BELOW : ih) - tb);
  const s = Math.min(cw / BW, ch / (tp ? BH : BH + BAR));
  const left = (iw - cw) / 2, top = 0;
  viewScale = s;
  CW = Math.floor(cw / s); CH = Math.floor(ch / s);
  W = CW; H = tp ? CH : CH - BAR;
  canvas.width = Math.round(CW * DPR); canvas.height = Math.round(CH * DPR);
  MM_X = W - MM_W - 8; MM_Y = Math.round(30 * hudK() + 8);
  if (touchReady) { clampCam(); syncMouse(); }
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  canvas.style.left = left + 'px'; canvas.style.top = top + 'px';
  if (touchReady) layoutTouch(iw, ih, land, left, top, cw, ch, tb);
}
addEventListener('resize', fit); fit();

const SLOT_W = 87, HERO_X = 12 + 8 * SLOT_W + 4, HERO_W = 69;
const hasArrows = () => heroOrder().includes('ammo');
// The hero slots share the bar's hero area: four upgrades, or for the Ranger three upgrades plus the arrow-type picker
const heroW = () => Math.floor(HERO_W * 4 / (heroOrder().length + (hasArrows() ? 1 : 0)));
// The Ranger's arrow-type picker (last hero slot): a 2×2 grid of arrow types; returns the cell under (sx, sy) in bar coordinates, or -1
const arrowPick = () => { const x = HERO_X + heroOrder().length * heroW(), y = H + 14, w = heroW() - 4; return { x, y, w, h: BAR - 20, cw: (w - 10) / 2, ch: 15 }; };
function arrowCellAt(sx, sy) {
  if (!hasArrows()) return -1;
  const r = arrowPick(), cx = Math.floor((sx - r.x - 4) / (r.cw + 2)), cy = Math.floor((sy - r.y - 17) / (r.ch + 2));
  return sx >= r.x && sx <= r.x + r.w && cx >= 0 && cx < 2 && cy >= 0 && cy < 2 ? cy * 2 + cx : -1;
}

const keys = {};
const mouse = { x: 0, y: 0, sx: 0, sy: 0, down: false, mid: false, mm: false };
const overMinimap = () => settings.minimap && mouse.sx >= MM_X && mouse.sx < MM_X + MM_W && mouse.sy >= MM_Y && mouse.sy < MM_Y + MM_H;
const inMap = () => mouse.sy < H && !overMinimap();
// mouse.anchor (touch only): the last tap stays on the same world spot while the camera moves
function syncMouse() {
  if (mouse.anchor) { mouse.sx = (mouse.x - cam.x) * ZOOM; mouse.sy = (mouse.y - cam.y) * ZOOM; }
  else { mouse.x = mouse.sx / ZOOM + cam.x; mouse.y = mouse.sy / ZOOM + cam.y; }
}
// Zoom to z, keeping the world point under screen point (px, py) in place
function zoomAt(z, px, py) {
  z = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, z));
  const wx = cam.x + px / ZOOM, wy = cam.y + py / ZOOM;
  ZOOM = z; cam.x = wx - px / ZOOM; cam.y = wy - py / ZOOM;
  if (px < W * 0.3 || px > W * 0.7 || py < H * 0.3 || py > H * 0.7) cam.follow = false;
  clampCam(); syncMouse();
}

const MM_COL = ['#3a5a34', '#2b6a99', '#77736b', '#1f5a28', '#8a5e32'];
let minimapCanvas;
function renderMinimapTerrain() {
  if (!minimapCanvas || minimapCanvas.width !== MM_W * DPR || minimapCanvas.height !== MM_H * DPR) {
    minimapCanvas = document.createElement('canvas'); minimapCanvas.width = MM_W * DPR; minimapCanvas.height = MM_H * DPR; }
  const g = minimapCanvas.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) { g.fillStyle = MM_COL[terrain[y][x]]; g.fillRect(x * MM_S, y * MM_S, MM_S, MM_S); }
}
// Small seeded random generator, so re-drawing the terrain (after chopping a tree or building a bridge)
// reproduces exactly the same grass, peaks and trees everywhere else.
function rng(seed) {
  return () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
}
const tileRng = (x, y, salt = 0) => rng(terrainSeed + y * 7919 + x * 104729 + salt * 15485863);
// Paint a smooth blob over every tile matching `test`: a disc per tile plus thick round-capped
// strokes to each matching neighbour, so ranges and rivers read as one organic shape.
function blobLayer(g, test, radius, joinW, color) {
  g.fillStyle = color; g.strokeStyle = color; g.lineCap = 'round'; g.lineWidth = joinW;
  g.beginPath();
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (!test(x, y)) continue;
    const cx = x * T + T / 2, cy = y * T + T / 2;
    g.moveTo(cx + radius, cy); g.arc(cx, cy, radius, 0, 6.2832);
  }
  g.fill();
  g.beginPath();
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (!test(x, y)) continue;
    const cx = x * T + T / 2, cy = y * T + T / 2;
    for (const [dx, dy] of [[1, 0], [0, 1], [1, 1], [-1, 1]]) {
      if (!inB(x + dx, y + dy) || !test(x + dx, y + dy)) continue;
      if (dx && dy && !(test(x + dx, y) || test(x, y + dy))) { // diagonal-only link: keep it thinner
        g.stroke(); g.beginPath(); g.lineWidth = joinW * 0.75;
        g.moveTo(cx, cy); g.lineTo(cx + dx * T, cy + dy * T); g.stroke(); g.beginPath(); g.lineWidth = joinW; continue;
      }
      g.moveTo(cx, cy); g.lineTo(cx + dx * T, cy + dy * T);
    }
  }
  g.stroke();
}
onTerrain = () => renderTerrain();
function renderTerrain() {
  renderMinimapTerrain();
  if (!terrainCanvas || terrainCanvas.width !== WW * DPR || terrainCanvas.height !== WH * DPR) {
    terrainCanvas = document.createElement('canvas'); terrainCanvas.width = WW * DPR; terrainCanvas.height = WH * DPR; }
  const g = terrainCanvas.getContext('2d');
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
  const is = t => (x, y) => terrain[y][x] === t;
  const wet = (x, y) => terrain[y][x] === WATER || terrain[y][x] === BRIDGE;

  // 1. grass: base colour + big soft light/dark patches (no tile checkerboard)
  g.fillStyle = '#34532f'; g.fillRect(0, 0, WW, WH);
  const R = rng(terrainSeed);
  for (let i = 0, n = COLS * ROWS / 3; i < n; i++) {
    const x = R() * WW, y = R() * WH, r = 30 + R() * 90, light = R() < 0.5;
    const grad = g.createRadialGradient(x, y, 0, x, y, r);
    grad.addColorStop(0, light ? 'rgba(84,122,70,0.32)' : 'rgba(30,52,30,0.32)'); grad.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grad; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
  // dusty spawn strip around the map edge (unbuildable)
  for (const [x0, y0, x1, y1, rx, ry, rw, rh] of [[0, 0, 0, T * 1.4, 0, 0, WW, T * 1.4], [0, WH, 0, WH - T * 1.4, 0, WH - T * 1.4, WW, T * 1.4],
                                                   [0, 0, T * 1.4, 0, 0, 0, T * 1.4, WH], [WW, 0, WW - T * 1.4, 0, WW - T * 1.4, 0, T * 1.4, WH]]) {
    const grad = g.createLinearGradient(x0, y0, x1, y1);
    grad.addColorStop(0, 'rgba(78,60,46,0.95)'); grad.addColorStop(0.65, 'rgba(78,60,46,0.6)'); grad.addColorStop(1, 'rgba(78,60,46,0)');
    g.fillStyle = grad; g.fillRect(rx, ry, rw, rh);
  }
  // grass tufts and flowers
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (terrain[y][x] !== GRASS) continue;
    const r = tileRng(x, y, 1);
    for (let k = 0; k < 4; k++) {
      const px = x * T + r() * T, py = y * T + r() * T, c = r();
      g.strokeStyle = c < 0.5 ? '#4a7442' : '#284423'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(px, py); g.lineTo(px - 1.5, py - 4); g.moveTo(px + 1.5, py); g.lineTo(px + 2.5, py - 3.5); g.stroke();
    }
    if (r() < 0.06) { g.fillStyle = r() < 0.5 ? '#e8d86a' : '#d9a0d0'; g.beginPath(); g.arc(x * T + r() * T, y * T + r() * T, 1.6, 0, 6.28); g.fill(); }
  }

  // 2. rivers: sandy bank, deep water, lighter current down the middle
  blobLayer(g, wet, T * 0.78, T * 1.5, '#86764c');
  blobLayer(g, wet, T * 0.62, T * 1.18, '#2a6797');
  blobLayer(g, wet, T * 0.34, T * 0.62, '#3479ab');

  // 3. mountain ground: rocky skirt joining the peaks of a range together
  blobLayer(g, is(ROCK), T * 0.7, T * 1.25, '#4a463f');
  blobLayer(g, is(ROCK), T * 0.55, T * 0.95, '#57524a');

  // 4. bridges over the water
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    if (terrain[y][x] !== BRIDGE) continue;
    const v = bridgeDir[y][x] === 'v', px = x * T, py = y * T, ext = 7;   // extend onto the banks
    const bx = v ? px + 4 : px - ext, by = v ? py - ext : py + 4, bw = v ? T - 8 : T + ext * 2, bh = v ? T + ext * 2 : T - 8;
    g.fillStyle = '#0004'; g.fillRect(bx + 2, by + 3, bw, bh);
    g.fillStyle = '#8f6236'; g.fillRect(bx, by, bw, bh);

  g.addColorStop(0, hue + 'aa'); g.addColorStop(1, hue + '00');
  ctx.fillStyle = g; ctx.beginPath(); ctx.ellipse(cx, cy, 40, 33, 0, 0, 6.28); ctx.fill();

  // floating crystal cluster
  const bob = Math.sin(t * 1.6) * 3, ky = cy - 14 + bob;
  ctx.fillStyle = `rgba(0,0,0,${0.35 - bob * 0.03})`; ctx.beginPath(); ctx.ellipse(cx, cy + 6, 15 - bob, 5, 0, 0, 6.28); ctx.fill();
  const crystal = (ox, oy, s, rot, main) => {
    ctx.save(); ctx.translate(cx + ox, ky + oy); ctx.rotate(rot); ctx.scale(s, s);
    ctx.shadowColor = hue; ctx.shadowBlur = main ? 18 + 14 * pulse + (core.flash ? 30 : 0) : 8;
    const top = [0, -36], ur = [12, -14], lr = [10, 14], bot = [0, 24], ll = [-10, 14], ul = [-12, -14];
    const poly = (pts, fill) => { ctx.fillStyle = fill; ctx.beginPath(); pts.forEach((p, i) => ctx[i ? 'lineTo' : 'moveTo'](p[0], p[1])); ctx.closePath(); ctx.fill(); };
    poly([top, ur, lr, bot, ll, ul], shade(hue, -0.25));               // silhouette
    ctx.shadowBlur = 0;
    poly([top, [0, -10], ul], shade(hue, 0.55));                          // upper-left facet (lit)
    poly([top, ur, [0, -10]], shade(hue, 0.1));                           // upper-right facet
    poly([ul, [0, -10], [0, 20], ll], core.flash ? '#fff' : shade(hue, 0.25)); // left face
    poly([[0, -10], ur, lr, [0, 20]], shade(hue, -0.2));                  // right face (shade)
    poly([ll, [0, 20], bot], shade(hue, -0.05)); poly([[0, 20], lr, bot], shade(hue, -0.4));
    ctx.strokeStyle = 'rgba(255,255,255,0.55)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(top[0], top[1]); ctx.lineTo(0, 20); ctx.moveTo(-6, -22); ctx.lineTo(-7, 4); ctx.stroke();
    if (main) { // cracks appear as the core is damaged
      ctx.strokeStyle = 'rgba(20,10,30,0.75)'; ctx.lineWidth = 1.3; ctx.beginPath();
      if (f < 0.75) { ctx.moveTo(-9, -12); ctx.lineTo(-4, -6); ctx.lineTo(-6, 2); ctx.lineTo(-2, 8); }
      if (f < 0.5) { ctx.moveTo(10, -6); ctx.lineTo(5, 0); ctx.lineTo(7, 6); ctx.moveTo(5, 0); ctx.lineTo(1, 3); }
      if (f < 0.25) { ctx.moveTo(-2, -30); ctx.lineTo(2, -22); ctx.lineTo(-1, -16); ctx.lineTo(3, -10); ctx.moveTo(-8, 12); ctx.lineTo(-2, 16); }
      ctx.stroke();
    }
    ctx.restore();
  };
  crystal(-15, 10, 0.5, -0.35, false);
  crystal(16, 12, 0.42, 0.4, false);
  crystal(0, 0, 1, 0, true);
  // orbiting motes of light
  for (let i = 0; i < 7; i++) {
    const a = t * 0.9 + i * 0.898, ox = Math.cos(a) * 30, oy = Math.sin(a) * 11 - 10 + bob;
    const front = Math.sin(a) > 0, tw = 0.5 + 0.5 * Math.sin(t * 5 + i * 2);
    ctx.fillStyle = `rgba(220,250,255,${(front ? 0.9 : 0.4) * tw})`;
    ctx.beginPath(); ctx.arc(cx + ox, ky + oy, front ? 2 : 1.4, 0, 6.28); ctx.fill();
  }
  bar(x + 10, y - 6, w - 20, 5, f, f > 0.5 ? '#6cf' : f > 0.25 ? '#c58bff' : '#ff5a6a');
}

// ---------- Building sprites ----------
// 3/4 top-down view with light from the top-left, matching the terrain, core and enemies.
const STONE = '#9aa1ab';
function rrect(x, y, w, h, r) { ctx.beginPath(); if (ctx.roundRect) ctx.roundRect(x, y, w, h, r); else ctx.rect(x, y, w, h); }
function bSeed(tx, ty, k = 0) { // stable per-tile random number in [0, 1)
  let h = Math.imul(tx + 1, 374761393) ^ Math.imul(ty + 7, 668265263) ^ Math.imul(k + 3, 982451653);
  h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function isWallAt(tx, ty) { const b = grid[ty] && grid[ty][tx]; return !!b && b.type === 'wall'; }
function bpoly(pts, fill) { ctx.fillStyle = fill; ctx.beginPath(); pts.forEach((p, i) => ctx[i ? 'lineTo' : 'moveTo'](p[0], p[1])); ctx.closePath(); ctx.fill(); }
function sparkle(x, y, s, a) {
  ctx.fillStyle = `rgba(255,250,215,${a})`; ctx.beginPath();
  ctx.moveTo(x, y - s); ctx.lineTo(x + s * 0.25, y - s * 0.25); ctx.lineTo(x + s, y); ctx.lineTo(x + s * 0.25, y + s * 0.25);
  ctx.lineTo(x, y + s); ctx.lineTo(x - s * 0.25, y + s * 0.25); ctx.lineTo(x - s, y); ctx.lineTo(x - s * 0.25, y - s * 0.25); ctx.fill();
}
function progressBar(x, y, w, frac, color) {
  ctx.fillStyle = '#000a'; rrect(x - 1, y - 1, w + 2, 4, 2); ctx.fill();
  ctx.fillStyle = color; rrect(x, y, Math.max(1, w * frac), 2, 1); ctx.fill();
}
// round stone plinth with visible height and a soft cast shadow
function stoneDisc(cx, cy, r, top, side) {
  ctx.fillStyle = '#0000005a'; ctx.beginPath(); ctx.ellipse(cx + 3, cy + 5, r, r * 0.92, 0, 0, 6.2832); ctx.fill();
  ctx.fillStyle = side; circ(cx, cy + 3, r); ctx.fill();
  const g = ctx.createRadialGradient(cx - r * 0.45, cy - r * 0.5, r * 0.1, cx, cy, r * 1.1);
  g.addColorStop(0, shade(top, 0.3)); g.addColorStop(0.6, top); g.addColorStop(1, shade(top, -0.3));
  ctx.fillStyle = g; circ(cx, cy, r); ctx.fill();
}
// ring of battlement blocks, each lit according to which way it faces
function merlons(cx, cy, r, n, color, size) {
  for (let i = 0; i < n; i++) {
    const a = i / n * 6.2832 + 0.39;
    ctx.save(); ctx.translate(cx + Math.cos(a) * r, cy + Math.sin(a) * r); ctx.rotate(a);
    ctx.fillStyle = shade(color, -0.45); ctx.fillRect(-size / 2 + 0.6, -size / 2 + 1.4, size, size);
    ctx.fillStyle = shade(color, Math.cos(a + 2.36) * 0.28); ctx.fillRect(-size / 2, -size / 2, size, size);
    ctx.restore();
  }
}

function drawWall(b, x, y, solo) {
  const tx = b.tx, ty = b.ty, c = (dx, dy) => !solo && isWallAt(tx + dx, ty + dy);
  const N = c(0, -1), S = c(0, 1), Wn = c(-1, 0), E = c(1, 0), FH = 7;
  const x0 = x + (Wn ? 0 : 2), x1 = x + T - (E ? 0 : 2), y0 = y + (N ? 0 : 2), y1 = y + T - (S ? 0 : 1);
  const topB = S ? y1 : y1 - FH;
  ctx.fillStyle = '#0000004d';                                   // cast shadow
  if (!S) ctx.fillRect(x0 + 3, y1, x1 - x0, 4);
  if (!E) ctx.fillRect(x1, y0 + 4, 3, y1 - y0);
  if (!S) {                                                      // front face with brick courses
    ctx.fillStyle = '#5f656e'; ctx.fillRect(x0, topB, x1 - x0, FH);
    ctx.strokeStyle = '#454a51'; ctx.lineWidth = 1; ctx.beginPath();
    ctx.moveTo(x0, topB + 3.5); ctx.lineTo(x1, topB + 3.5);
    for (let k = x + 4; k < x1; k += 8) {
      if (k > x0) { ctx.moveTo(k + 0.5, topB); ctx.lineTo(k + 0.5, topB + 3.5); }
      if (k + 4 > x0 && k + 4 < x1) { ctx.moveTo(k + 4.5, topB + 3.5); ctx.lineTo(k + 4.5, topB + FH); }
    }
    ctx.stroke();
  }
  ctx.fillStyle = '#5a6069'; ctx.fillRect(x0, y0, x1 - x0, topB - y0);   // mortar bed
  [[y0, y + 13], [y + 13, topB]].forEach(([r0, r1], ri) => {             // two courses of dressed stones
    const split = x + 9 + Math.floor(bSeed(tx, ty, ri) * 14);
    [[x0, split], [split, x1]].forEach(([s0, s1], si) => {
      ctx.fillStyle = shade(STONE, (bSeed(tx, ty, ri * 2 + si + 5) - 0.5) * 0.24);
      ctx.fillRect(s0 + 1, r0 + 1, s1 - s0 - 2, r1 - r0 - 2);
      ctx.fillStyle = '#ffffff2a'; ctx.fillRect(s0 + 1, r0 + 1, s1 - s0 - 2, 1.5);
      ctx.fillStyle = '#00000022'; ctx.fillRect(s0 + 1, r1 - 2.5, s1 - s0 - 2, 1.5);
    });
  });
  ctx.fillStyle = '#d8dce2';                                     // lit rims on open edges
  if (!N) ctx.fillRect(x0, y0, x1 - x0, 1.5);
  if (!Wn) ctx.fillRect(x0, y0, 1.5, topB - y0);
  ctx.fillStyle = '#41464d';
  if (!E) ctx.fillRect(x1 - 1.5, y0, 1.5, y1 - y0);
  if (!S) { ctx.fillStyle = '#c4c9d0'; ctx.fillRect(x0, topB - 1, x1 - x0, 1); }
}

function drawArrowTower(b, x, y) {
  const cx = x + T / 2, cy = y + T / 2 - 1, rec = Math.min(1, (b.fireT || 0) / 0.25);
  stoneDisc(cx, cy, 13.5, '#aaa293', '#5b544a');
  ctx.save(); circ(cx, cy, 9.5); ctx.fillStyle = '#7b5532'; ctx.fill(); ctx.clip();   // plank deck
  ctx.strokeStyle = '#5a3b1f'; ctx.lineWidth = 1; ctx.beginPath();
  for (let k = -8; k <= 9; k += 3.4) { ctx.moveTo(cx - 10, cy + k); ctx.lineTo(cx + 10, cy + k); }
  ctx.stroke(); ctx.restore();
  ctx.strokeStyle = '#3e3022'; ctx.lineWidth = 1; circ(cx, cy, 9.5); ctx.stroke();
  merlons(cx, cy, 11.6, 8, '#b8b09f', 4.6);
  // swivelling ballista; the string snaps forward and the stock kicks back on each shot
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(b.aim ?? -1.57); ctx.translate(-rec * 2, 0);
  ctx.fillStyle = '#3b2a18'; circ(0, 0, 3.6); ctx.fill();
  ctx.fillStyle = '#8f6838'; ctx.fillRect(-6, -1.6, 17, 3.2);
  ctx.fillStyle = '#b8905a'; ctx.fillRect(-6, -1.6, 17, 1);
  const pull = rec > 0 ? 4.5 : -2.5;
  ctx.strokeStyle = '#ece6d4'; ctx.lineWidth = 0.9; ctx.beginPath();
  ctx.moveTo(5, -9); ctx.lineTo(pull, 0); ctx.lineTo(5, 9); ctx.stroke();
  ctx.strokeStyle = '#d4a62a'; ctx.lineWidth = 2.4; ctx.lineCap = 'round'; ctx.beginPath();
  ctx.moveTo(5, -9); ctx.quadraticCurveTo(11, -5, 9, 0); ctx.quadraticCurveTo(11, 5, 5, 9); ctx.stroke();
  ctx.strokeStyle = '#7a5a10'; ctx.lineWidth = 0.8; ctx.beginPath();
  ctx.moveTo(6.5, -7); ctx.quadraticCurveTo(10, -4, 8.5, 0); ctx.stroke();
  if (rec === 0) {                                               // loaded bolt
    ctx.strokeStyle = '#d9d9d9'; ctx.lineWidth = 1.3; ctx.beginPath(); ctx.moveTo(-2.5, 0); ctx.lineTo(12, 0); ctx.stroke();
    bpoly([[12, -2], [15.5, 0], [12, 2]], '#f2f2f2');
    ctx.fillStyle = '#c33'; ctx.fillRect(-3, -1.6, 3, 3.2);
  }
  ctx.restore();
}

function drawCannon(b, x, y) {
  const cx = x + T / 2, cy = y + T / 2 - 1, s = 13, rec = Math.min(1, (b.fireT || 0) / 0.25);
  ctx.fillStyle = '#0000005a'; rrect(cx - s + 3, cy - s + 5, s * 2, s * 2, 4); ctx.fill();
  ctx.fillStyle = '#4a4440'; rrect(cx - s, cy - s + 3, s * 2, s * 2, 4); ctx.fill();          // bastion height
  let g = ctx.createLinearGradient(cx - s, cy - s, cx + s, cy + s);
  g.addColorStop(0, '#a0958a'); g.addColorStop(1, '#675e56');
  ctx.fillStyle = g; rrect(cx - s, cy - s, s * 2, s * 2, 4); ctx.fill();
  ctx.fillStyle = '#3b3631'; rrect(cx - 9, cy - 9, 18, 18, 3); ctx.fill();                   // gun pit
  ctx.strokeStyle = '#c0483f'; ctx.lineWidth = 1.2; rrect(cx - 9.5, cy - 9.5, 19, 19, 3.5); ctx.stroke();
  for (const [dx, dy] of [[-1, -1], [1, -1], [-1, 1], [1, 1]]) {                             // corner blocks
    const bx = cx + dx * (s - 3.5) - 3.5, by = cy + dy * (s - 3.5) - 3.5;
    ctx.fillStyle = '#4e4741'; ctx.fillRect(bx + 0.6, by + 1.4, 7, 7);
    ctx.fillStyle = shade('#958a7f', (-dx - dy) * 0.14); ctx.fillRect(bx, by, 7, 7);
    ctx.fillStyle = '#ffffff30'; ctx.fillRect(bx, by, 7, 1.2);
  }
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(b.aim ?? -1.57);
  ctx.fillStyle = '#6b4a2b'; ctx.fillRect(-5, -6, 10, 12);                                  // carriage
  ctx.fillStyle = '#2a2018'; ctx.fillRect(-4.5, -8, 9, 2.6); ctx.fillRect(-4.5, 5.4, 9, 2.6); // wheels
  const r = -rec * 4;                                                                         // recoil
  g = ctx.createLinearGradient(0, -4.5, 0, 4.5);
  g.addColorStop(0, '#5d636b'); g.addColorStop(0.3, '#a3abb5'); g.addColorStop(1, '#23272c');
  ctx.fillStyle = g; ctx.beginPath();
  ctx.moveTo(-4 + r, -4.2); ctx.lineTo(13 + r, -3.2); ctx.lineTo(13 + r, 3.2); ctx.lineTo(-4 + r, 4.2); ctx.closePath(); ctx.fill();
  circ(-4 + r, 0, 4.6); ctx.fill();
  ctx.fillStyle = '#2b2f34'; ctx.fillRect(12 + r, -4, 3, 8); ctx.fillRect(3 + r, -4.1, 1.6, 8.2);
  ctx.fillStyle = '#111'; circ(15 + r, 0, 1.6); ctx.fill();
  if (rec > 0) {
    ctx.fillStyle = `rgba(255,190,80,${rec})`; circ(17, 0, 2 + 4 * rec); ctx.fill();          // muzzle flash
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = `rgba(200,200,200,${0.45 * rec})`;
      circ(17 + (1 - rec) * 10 + i * 3, (i - 1) * 2.5, 2.5 + (1 - rec) * 4); ctx.fill();
    }
  }
  ctx.restore();
}

function drawFrost(b, x, y, t) {
  const cx = x + T / 2, cy = y + T / 2;
  if (b.pulse > 0) { b.pulse -= 1 / 60; ctx.strokeStyle = `rgba(120,210,255,${b.pulse * 2})`; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(cx, cy, stat(b, 'range') * T * (1 - b.pulse * 2 + 0.2), 0, 6.28); ctx.stroke(); }
  const hex = (r, ox = 0, oy = 0) => { ctx.beginPath(); for (let i = 0; i < 6; i++) { const a = i * 1.0472 + 0.5236;
    ctx[i ? 'lineTo' : 'moveTo'](cx + ox + Math.cos(a) * r, cy + oy + Math.sin(a) * r * 0.92); } ctx.closePath(); };
  ctx.fillStyle = '#0000005a'; hex(13.5, 3, 4); ctx.fill();
  ctx.fillStyle = '#3c4a5a'; hex(13.5, 0, 3); ctx.fill();
  let g = ctx.createLinearGradient(cx - 12, cy - 12, cx + 12, cy + 12);
  g.addColorStop(0, '#b4c7d6'); g.addColorStop(1, '#5d7286');
  ctx.fillStyle = g; hex(13.5); ctx.fill(); ctx.strokeStyle = '#d4e6f2'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = '#2c3a4a'; hex(9); ctx.fill();
  const pulse = 0.5 + 0.5 * Math.sin(t * 2.5 + b.tx);
  ctx.strokeStyle = `rgba(130,220,255,${0.45 + 0.35 * pulse})`; ctx.lineWidth = 1.2; circ(cx, cy, 7); ctx.stroke();
  g = ctx.createRadialGradient(cx, cy - 3, 1, cx, cy - 3, 15);
  g.addColorStop(0, `rgba(160,235,255,${0.35 + 0.25 * pulse})`); g.addColorStop(1, 'rgba(160,235,255,0)');
  ctx.fillStyle = g; circ(cx, cy - 3, 15); ctx.fill();
  const shard = (sx, sy, s, rot) => {
    ctx.save(); ctx.translate(sx, sy); ctx.rotate(rot); ctx.scale(s, s);
    bpoly([[0, -15], [4.5, -5], [0, 4], [-4.5, -5]], '#6fbde0');
    bpoly([[0, -15], [0, 4], [-4.5, -5]], '#e4f7ff');
    bpoly([[0, -15], [4.5, -5], [0, -4]], '#a9e0f7');
    ctx.strokeStyle = '#ffffffaa'; ctx.lineWidth = 0.8 / s; ctx.beginPath(); ctx.moveTo(0, -15); ctx.lineTo(0, 4); ctx.stroke();
    ctx.restore();
  };
  const bob = Math.sin(t * 1.8 + b.ty) * 1.2;
  shard(cx - 5.5, cy + 2, 0.55, -0.45); shard(cx + 5.5, cy + 2.5, 0.5, 0.45); shard(cx, cy + bob, 1, 0);
  for (let i = 0; i < 3; i++) {                                  // orbiting snowflakes
    const a = t * 1.4 + i * 2.094, front = Math.sin(a) > 0;
    sparkle(cx + Math.cos(a) * 11, cy - 3 + Math.sin(a) * 7, front ? 2.4 : 1.6, front ? 0.95 : 0.5);
  }
}

function drawMine(b, x, y, t) {
  const cx = x + T / 2, cy = y + T / 2, pop = Math.min(1, (b.fireT || 0) / 0.6);
  const pts = [];
  for (let i = 0; i < 10; i++) { const a = i / 10 * 6.2832, r = 12 + bSeed(b.tx, b.ty, i) * 2.5;
    pts.push([cx + Math.cos(a) * r, cy - 2 + Math.sin(a) * r * 0.82]); }
  ctx.save(); ctx.translate(3, 4); bpoly(pts, '#0000005a'); ctx.restore();
  let g = ctx.createRadialGradient(cx - 5, cy - 9, 1, cx, cy - 2, 16);
  g.addColorStop(0, '#b29d80'); g.addColorStop(0.55, '#7a6750'); g.addColorStop(1, '#4b3e30');
  bpoly(pts, g);
  for (let i = 0; i < 4; i++) {                                  // loose rocks
    const rx = cx - 9 + bSeed(b.tx, b.ty, 20 + i) * 18, ry = cy - 10 + bSeed(b.tx, b.ty, 30 + i) * 7;
    ctx.fillStyle = '#5a4b3a'; ctx.beginPath(); ctx.ellipse(rx + 0.6, ry + 0.8, 2.4, 1.6, 0, 0, 6.28); ctx.fill();
    ctx.fillStyle = '#a8957a'; ctx.beginPath(); ctx.ellipse(rx, ry, 2.2, 1.4, 0, 0, 6.28); ctx.fill();
  }
  const veins = [[cx - 7, cy - 5], [cx + 5, cy - 9], [cx + 8, cy - 3]];
  for (const [vx, vy] of veins) { ctx.fillStyle = '#7a5a10'; circ(vx + 0.5, vy + 0.5, 1.6); ctx.fill(); ctx.fillStyle = '#ffd84a'; circ(vx, vy, 1.4); ctx.fill(); }
  // shaft entrance with a timber frame and rails
  ctx.fillStyle = '#140d07'; ctx.beginPath(); ctx.moveTo(cx - 6, cy + 9); ctx.lineTo(cx - 6, cy + 2);
  ctx.arc(cx, cy + 2, 6, Math.PI, 0); ctx.lineTo(cx + 6, cy + 9); ctx.closePath(); ctx.fill();
  ctx.strokeStyle = '#6e6e72'; ctx.lineWidth = 1; ctx.beginPath();
  ctx.moveTo(cx - 2.5, cy + 6); ctx.lineTo(cx - 3.5, cy + 14); ctx.moveTo(cx + 2.5, cy + 6); ctx.lineTo(cx + 3.5, cy + 14); ctx.stroke();
  ctx.fillStyle = '#8a5e32'; ctx.fillRect(cx - 8, cy + 1, 2.5, 8.5); ctx.fillRect(cx + 5.5, cy + 1, 2.5, 8.5);
  ctx.fillRect(cx - 9, cy - 2, 18, 3); ctx.fillStyle = '#b8834c'; ctx.fillRect(cx - 9, cy - 2, 18, 1);
  // ore cart: the gold heap hops when the mine pays out
  const hop = Math.sin(pop * Math.PI) * 2.5;
  ctx.fillStyle = '#0000004d'; ctx.fillRect(cx + 7, cy + 12, 9, 2);
  ctx.fillStyle = '#ffd84a'; ctx.beginPath(); ctx.ellipse(cx + 11, cy + 6.5 - hop, 4, 2.6, 0, 0, 6.28); ctx.fill();
  ctx.fillStyle = '#fff3b0'; circ(cx + 10, cy + 5.5 - hop, 1.1); ctx.fill();
  ctx.fillStyle = '#50555c'; rrect(cx + 6.5, cy + 7, 9, 5, 1); ctx.fill();
  ctx.fillStyle = '#7d838c'; ctx.fillRect(cx + 6.5, cy + 7, 9, 1);
  ctx.fillStyle = '#1e1e22'; circ(cx + 8.5, cy + 12.3, 1.4); ctx.fill(); circ(cx + 13.5, cy + 12.3, 1.4); ctx.fill();
  const ph = (t * 0.5 + bSeed(b.tx, b.ty, 9)) % 1, v = veins[Math.floor(t * 0.5 + bSeed(b.tx, b.ty, 9)) % 3];
  if (ph < 0.3) sparkle(v[0], v[1], 3.5 * Math.sin(ph / 0.3 * Math.PI), 0.9);
  if (pop > 0) sparkle(cx + 11, cy + 4 - hop, 5 * pop, pop);
}

function drawBarracks(b, x, y, t) {
  const L = x + 4, R = x + T - 4, wt = y + 16, wb = y + 29, cx = x + T / 2, col = DEFS.barracks.color;
  ctx.fillStyle = '#0000005a'; rrect(L + 3, y + 8, R - L, wb - y - 6, 2); ctx.fill();
  ctx.fillStyle = '#8a6440'; ctx.fillRect(L, wt, R - L, wb - wt);                         // timber front wall
  ctx.strokeStyle = '#6c4c2e'; ctx.lineWidth = 0.8; ctx.beginPath();
  for (let k = L + 3; k < R; k += 3) { ctx.moveTo(k, wt); ctx.lineTo(k, wb); } ctx.stroke();
  ctx.fillStyle = '#6f6b66'; ctx.fillRect(L - 0.5, wb - 2.5, R - L + 1, 2.5);              // stone footing
  ctx.fillStyle = '#2a1b10'; ctx.beginPath(); ctx.moveTo(cx - 3.5, wb - 2.5); ctx.lineTo(cx - 3.5, y + 22);
  ctx.arc(cx, y + 22, 3.5, Math.PI, 0); ctx.lineTo(cx + 3.5, wb - 2.5); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#c7a26e'; circ(cx + 2, y + 24, 0.7); ctx.fill();
  for (const wx of [L + 2, R - 7]) {                                                        // lit windows
    ctx.fillStyle = '#3a2614'; ctx.fillRect(wx - 0.5, y + 19.5, 6, 5);
    ctx.fillStyle = '#ffd98a'; ctx.fillRect(wx, y + 20, 5, 4);
    ctx.fillStyle = '#3a2614'; ctx.fillRect(wx + 2, y + 20, 1, 4);
  }
  // hipped roof: back slope and left hip catch the light, right hip in shade
  bpoly([[x + 4, y + 3], [x + T - 4, y + 3], [x + T - 9, y + 8], [x + 9, y + 8]], shade(col, 0.22));
  bpoly([[x + 4, y + 3], [x + 9, y + 8], [x + 1.5, y + 18]], shade(col, 0.32));

// Attack range rings, shown while the hero walks (fade out shortly after stopping)
function drawHeroRange() {

  const rings = hero.dagger
    ? [[daggerRange(), [7, 6], 0.55]]
    : [[heroRange(), [7, 6], 0.7]];
  if (heroType === 'engineer') rings.push([auraR(player), [3, 5], 0.45]);
  if (heroType === 'knight') rings.push([tauntR(player), [2, 6], 0.35]);

    ctx.fillStyle = `rgba(${r},${g},${b},${0.07 * a})`; circ(player.x, player.y, rad); ctx.fill();
    ctx.setLineDash(dash); ctx.lineWidth = 1.8; ctx.strokeStyle = `rgba(${r},${g},${b},${k * a})`; circ(player.x, player.y, rad); ctx.stroke();
    ctx.setLineDash([]);

}
function drawPlayer() {

function drawGhost() {

  acts.push(`<div class="act" data-act="sell">${busy ? '✕ Cancel' : '$ Sell'}<span>+${sellValue(b)}</span></div>`);
  if (!busy && (b.type === 'barracks' || b.type === 'medic')) acts.push(`<div class="act" data-act="squad">⚐ Move<span>${b.type === 'medic' ? 'medics' : 'squad'}</span></div>`);
  return `<div class="h">${d.name} <span class="lv">Lv ${L}/${maxLevel(b)}</span><div class="x" data-act="close">✕</div></div>${rows.join('')}<div class="acts">${acts.join('')}</div>`;
}
function updateCard(b) {
  if (!b) { if (card.style.display !== 'none') card.style.display = 'none'; cardHtmlNow = ''; return; }
  const html = cardHtml(b);
  if (html !== cardHtmlNow) { card.innerHTML = html; cardHtmlNow = html; }
  card.style.display = 'block';
  // Beside the building on screen (right of it if there's room, else left), kept inside the map
  const r = canvas.getBoundingClientRect(), k = r.width / CW;
  const sx = r.left + (b.tx * T + T / 2 - cam.x) * ZOOM * k, sy = r.top + (b.ty * T + T / 2 - cam.y) * ZOOM * k, off = T / 2 * ZOOM * k + 12;
  const w = card.offsetWidth, h = card.offsetHeight;
  let x = sx + off; if (x + w > r.right - 6) x = sx - off - w;
  x = Math.max(r.left + 6, Math.min(r.right - w - 6, x));
  const y = Math.max(r.top + (30 * hudK() + 6) * k, Math.min(r.bottom - h - 6, sy - h / 2));
  card.style.left = x + 'px'; card.style.top = y + 'px';
}
function cardDo(act) {
  const b = liveInspected();
  if (!b || gameState !== 'play') return;
  if (act === 'up') cmd({ t: 'up', x: b.tx, y: b.ty });
  else if (act === 'sell') { cmd({ t: 'sell', x: b.tx, y: b.ty }); inspected = null; }
  else if (act === 'squad') { rallyMode = b; selected = null; touchMode = null; inspected = null; }
  else if (act === 'close') inspected = null;
}
card.addEventListener('touchstart', e => {
  e.preventDefault(); e.stopPropagation();
  const el = e.target.closest('[data-act]'); cardAct = el ? el.dataset.act : null;
  if (el) el.classList.add('press');
}, { passive: false });
card.addEventListener('touchend', e => {
  e.preventDefault(); e.stopPropagation();
  card.querySelectorAll('.press').forEach(el => el.classList.remove('press'));
  if (cardAct) cardDo(cardAct); cardAct = null;
}, { passive: false });
card.addEventListener('touchcancel', () => { cardAct = null; card.querySelectorAll('.press').forEach(el => el.classList.remove('press')); });
card.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if (el) cardDo(el.dataset.act); });   // mouse / stylus fallback
// ----- Big-button build bar (touch play) -----
const bbar = document.getElementById('bbar');
const bbItems = [];
function addBB(cls, html, fn) {
  const el = document.createElement('div'); el.className = 'bb ' + cls; el.innerHTML = html;
  el.addEventListener('touchstart', e => { e.preventDefault(); el.classList.add('press'); }, { passive: false });
  el.addEventListener('touchend', e => { e.preventDefault(); el.classList.remove('press'); if (gameState === 'play') fn(); }, { passive: false });
  el.addEventListener('touchcancel', () => el.classList.remove('press'));
  el.addEventListener('click', () => { if (gameState === 'play') fn(); });
  bbar.appendChild(el); return el;
}
const BB_NAMES = { arrow: 'Arrow', frost: 'Frost', mine: 'Mine', medic: 'Medic' };   // short enough for the touch buttons
for (const k of ORDER) {
  const d = DEFS[k];
  const el = addBB('', `<canvas width="52" height="52"></canvas><div class="n">${BB_NAMES[k] || d.name}</div><div class="c">${d.cost}</div>`, () => {
    rallyMode = null; touchMode = null; inspected = null; selected = selected === k ? null : k;
  });
  const g = el.querySelector('canvas').getContext('2d'), main = ctx;
  try { ctx = g; g.setTransform(2, 0, 0, 2, 0, 0); drawBuildingIcon(k, 0, 0, 26); } catch (e) {} finally { ctx = main; }
  bbItems.push({ el, k, cls: '' });
}
// Hero-upgrade buttons; each slot shows whichever upgrade the current hero has there (the Knight has his own).
// Slots the current hero doesn't have are hidden (the Ranger has three, plus the arrow-type switch after them).
[...HERO_ORDER, 'ammo'].forEach((k0, slot) => {
  const u = HERO_UPS[k0];
  const el = addBB('hero', `<div class="n">${u.name}</div><div class="pips">${'<i></i>'.repeat(5)}</div><div class="c"></div>`, () => {
    const k = heroOrder()[slot];
    if (k === 'ammo' && heroUp.ammo >= HERO_UPS.ammo.max) cmd({ t: 'arrow' }); else if (k) cmd({ t: 'hero', k });
  });
  el.style.borderColor = u.color;
  bbItems.push({ el, slot, hk: k0, shown: '', cls: '', cost: '', lvl: -1, pips: [...el.querySelectorAll('.pips i')], c: el.querySelector('.c'), n: el.querySelector('.n') });
});
{ // Ranger: tap to switch between the arrow types he owns
  const el = addBB('hero', `<div class="n">Arrow type</div><div class="c"></div>`, () => cmd({ t: 'arrow' }));
  bbItems.push({ el, sw: true, cls: '', cost: '', c: el.querySelector('.c') });
}
function updateBuildBar() {
  if (gameState !== 'play' || !player) return;
  const gold = funds(player), ranger = heroOrder().includes('ammo');
  for (const it of bbItems) {
    let cls = 'bb';
    if (it.k) { cls += selected === it.k ? ' sel' : ''; if (gold < DEFS[it.k].cost) cls += ' poor'; }
    else if (it.sw || !heroOrder()[it.slot]) {
      if (!it.sw || !ranger) cls += ' gone';
      else {
        const a = ARROWS[heroUp.arrow || 0], txt = heroUp.ammo ? a.name : '—';
        cls += ' hero' + (heroUp.ammo ? '' : ' poor');
        if (txt !== it.cost) { it.cost = txt; it.c.textContent = txt; it.c.style.color = heroUp.ammo ? a.color : ''; it.el.style.borderColor = heroUp.ammo ? a.color : ''; }
      }
    }
    else {
      it.hk = heroOrder()[it.slot];
      if (it.shown !== it.hk) {   // hero changed: relabel the slot
        const v = HERO_UPS[it.hk]; it.shown = it.hk; it.n.textContent = v.name; it.el.style.borderColor = v.color; it.lvl = -1;
        it.pips.forEach((p, j) => { p.style.display = j < v.max ? '' : 'none'; });
      }
      const u = HERO_UPS[it.hk], lvl = heroUp[it.hk], maxed = lvl >= u.max, c = maxed ? 'MAX' : String(heroCost(it.hk));
      cls += ' hero' + (maxed ? ' max' : heroFunds(player) < heroCost(it.hk) ? ' poor' : '');
      if (c !== it.cost) { it.cost = c; it.c.textContent = c; }
      if (lvl !== it.lvl) { it.lvl = lvl; it.pips.forEach((p, j) => { p.style.background = j < lvl ? u.color : ''; }); }
    }
    if (cls !== it.cls) { it.cls = cls; it.el.className = cls; }
  }
}
touchReady = true; fit();
startGame(); gameState = 'menu';
requestAnimationFrame(loop);
</script>
